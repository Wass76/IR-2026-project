<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Project 2026 — Search</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f8fb; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .sub { color: #555; margin-bottom: 1.5rem; }
    .panel { background: #fff; border: 1px solid #dde3ee; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input, select, button, textarea { font: inherit; }
    input[type="text"], select { width: 100%; padding: 0.6rem; border: 1px solid #ccd4e0; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 0.65rem 1rem; cursor: pointer; }
    button.secondary { background: #eef2f8; color: #1a1a1a; }
    .result { border-top: 1px solid #eef2f8; padding: 0.75rem 0; }
    .score { color: #666; font-size: 0.9rem; }
    .snippet { margin-top: 0.35rem; line-height: 1.45; }
    .meta { font-size: 0.9rem; color: #444; white-space: pre-wrap; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
    .session { background: #f0f6ff; border-radius: 8px; padding: 0.75rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <h1>IR Project 2026</h1>
  <p class="sub">Search the Quora corpus via the SOA REST API.</p>

  <div class="panel">
    <label for="query">Query</label>
    <input id="query" type="text" placeholder="Enter your search query..." />

    <div class="row" style="margin-top: 1rem;">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="bm25">BM25</option>
          <option value="tfidf">TF-IDF</option>
          <option value="embedding">Embedding</option>
          <option value="hybrid_serial">Hybrid Serial</option>
          <option value="hybrid_parallel">Hybrid Parallel</option>
        </select>
      </div>
      <div>
        <label for="topk">Top K</label>
        <input id="topk" type="text" value="10" />
      </div>
    </div>

    <label style="margin-top: 1rem;">
      <input id="refine" type="checkbox" /> Use query refinement
    </label>

    <div class="actions">
      <button id="loadBtn" class="secondary">Load Index</button>
      <button id="searchBtn">Search</button>
      <button id="refineBtn" class="secondary">Preview Refinement</button>
    </div>
  </div>

  <div class="panel">
    <h3>Status</h3>
    <p class="hint">Index settings stay fixed after load. Session stats update after each search.</p>
    <div id="session" class="session">Session: not started</div>
    <pre id="status" class="meta">Not loaded yet.</pre>
  </div>

  <div class="panel">
    <h3>Results</h3>
    <div id="results"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const sessionEl = document.getElementById("session");
    const resultsEl = document.getElementById("results");

    function renderSession(data) {
      const s = data.session || {};
      sessionEl.innerHTML = `
        <strong>Session</strong><br>
        Searches: ${s.search_count ?? 0} |
        History: ${s.history_size ?? 0} |
        Last model: ${s.last_model ?? "-"}<br>
        Last query: ${s.last_query ? `"${s.last_query}"` : "-"}
      `;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      return data;
    }

    async function refreshStatus() {
      try {
        const data = await api("/health");
        renderSession(data);
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${err.message}</span>`;
      }
    }

    document.getElementById("loadBtn").onclick = async () => {
      statusEl.textContent = "Loading index...";
      try {
        await api("/services/index/load", { method: "POST" });
        await refreshStatus();
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${err.message}</span>`;
      }
    };

    document.getElementById("refineBtn").onclick = async () => {
      const text = document.getElementById("query").value.trim();
      if (!text) return;
      try {
        const data = await api("/services/refine", {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        resultsEl.innerHTML = `<pre class="meta">${JSON.stringify(data, null, 2)}</pre>`;
        await refreshStatus();
      } catch (err) {
        resultsEl.innerHTML = `<p class="error">${err.message}</p>`;
      }
    };

    document.getElementById("searchBtn").onclick = async () => {
      const query = document.getElementById("query").value.trim();
      if (!query) return;
      resultsEl.innerHTML = "<p>Searching...</p>";
      try {
        const payload = {
          query,
          model: document.getElementById("model").value,
          top_k: Number(document.getElementById("topk").value || 10),
          use_refinement: document.getElementById("refine").checked,
        };
        const data = await api("/services/search", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        await refreshStatus();
        if (!data.results.length) {
          resultsEl.innerHTML = "<p>No results.</p>";
          return;
        }
        resultsEl.innerHTML = data.results.map((r, i) => `
          <div class="result">
            <strong>#${i + 1} ${r.doc_id}</strong>
            <div class="score">score: ${r.score}</div>
            <div class="snippet">${r.snippet}</div>
          </div>
        `).join("");
      } catch (err) {
        resultsEl.innerHTML = `<p class="error">${err.message}</p>`;
      }
    };

    refreshStatus();
  </script>
</body>
</html>
