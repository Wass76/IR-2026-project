<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Project 2026 — Search</title>
  <style>
    :root {
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
      color: #1a1a1a;
      background: #f6f8fb;
    }
    body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1, h3 { margin-bottom: 0.35rem; }
    .sub { color: #555; margin-bottom: 1.5rem; }
    .panel {
      background: #fff;
      border: 1px solid #dde3ee;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input, select, button, textarea { font: inherit; }
    input[type="text"], select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .row-weights { margin-top: 0.75rem; }
    input[type="number"] {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    button {
      background: #1f6feb;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }
    button.secondary { background: #eef2f8; color: #1a1a1a; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
    .session { background: #f0f6ff; border-radius: 8px; padding: 0.75rem; margin-top: 0.75rem; }
    .meta { font-size: 0.9rem; color: #444; white-space: pre-wrap; }
    .error { color: #b42318; }
    .hidden { display: none; }
    .summary {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      line-height: 1.7;
    }
    .summary strong { color: #1f6feb; }
    .hybrid-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-top: 1rem;
      line-height: 1.7;
    }
    .result {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #fafbfc;
    }
    .result-header {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1f6feb;
      margin-bottom: 0.5rem;
    }
    .result-score { color: #555; font-size: 0.92rem; margin-bottom: 0.75rem; }
    .full-label {
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: #334155;
    }
    .full-content {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    details summary { cursor: pointer; font-weight: 600; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>IR Project 2026</h1>
  <p class="sub">Search the Quora corpus via the SOA REST API.</p>

  <div class="panel">
    <label for="query">Query</label>
    <input id="query" type="text" placeholder="e.g. What causes a nightmare?" />

    <div class="row" style="margin-top: 1rem;">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="bm25">BM25</option>
          <option value="tfidf">TF-IDF</option>
          <option value="embedding">Dense Embedding</option>
          <option value="hybrid_serial">Hybrid Serial</option>
          <option value="hybrid_parallel">Hybrid Parallel</option>
        </select>
      </div>
      <div>
        <label for="topk">Top K</label>
        <input id="topk" type="text" value="10" />
      </div>
    </div>

    <div id="hybridPanel" class="hybrid-box hidden">
      <strong>Hybrid Settings</strong>
      <div id="hybridSettings" class="hint" style="margin-top: 0.5rem;">—</div>
      <div id="hybridWeights" class="row row-weights hidden">
        <div>
          <label for="bm25Weight">BM25 Weight</label>
          <input id="bm25Weight" type="number" min="0" max="1" step="0.05" value="0.5" />
        </div>
        <div>
          <label for="denseWeight">Dense Weight</label>
          <input id="denseWeight" type="number" min="0" max="1" step="0.05" value="0.5" />
        </div>
      </div>
      <p id="hybridWeightHint" class="hint hidden">Weights use score-level fusion (normalized BM25 + dense scores).</p>
    </div>

    <label style="margin-top: 1rem;">
      <input id="refine" type="checkbox" /> Use query refinement
    </label>

    <div class="actions">
      <button id="loadBtn" class="secondary">Load Index</button>
      <button id="searchBtn">Search</button>
      <button id="refineBtn" class="secondary">Preview Refinement</button>
    </div>
  </div>

  <div class="panel">
    <details>
      <summary>System Status</summary>
      <div id="session" class="session">Session: not started</div>
      <pre id="status" class="meta">Not loaded yet.</pre>
    </details>
  </div>

  <div class="panel">
    <h3>Results</h3>
    <div id="searchSummary" class="hint">Run a search to display results.</div>
    <div id="results"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const sessionEl = document.getElementById("session");
    const resultsEl = document.getElementById("results");
    const searchSummaryEl = document.getElementById("searchSummary");
    const hybridPanel = document.getElementById("hybridPanel");
    const hybridSettingsEl = document.getElementById("hybridSettings");
    const hybridWeightsEl = document.getElementById("hybridWeights");
    const hybridWeightHintEl = document.getElementById("hybridWeightHint");
    const bm25WeightInput = document.getElementById("bm25Weight");
    const denseWeightInput = document.getElementById("denseWeight");
    const modelSelect = document.getElementById("model");

    let hybridConfig = null;

    const MODEL_LABELS = {
      bm25: "BM25",
      tfidf: "TF-IDF",
      embedding: "Dense Embedding",
      hybrid_serial: "Hybrid Serial",
      hybrid_parallel: "Hybrid Parallel",
    };

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function clampWeight(value) {
      const n = Number(value);
      if (Number.isNaN(n)) return 0;
      return Math.min(1, Math.max(0, n));
    }

    function setParallelWeights(bm25, dense) {
      bm25WeightInput.value = clampWeight(bm25).toFixed(2);
      denseWeightInput.value = clampWeight(dense).toFixed(2);
    }

    function syncBm25Weight() {
      const bm25 = clampWeight(bm25WeightInput.value);
      setParallelWeights(bm25, 1 - bm25);
    }

    function syncDenseWeight() {
      const dense = clampWeight(denseWeightInput.value);
      setParallelWeights(1 - dense, dense);
    }

    function isHybridModel(model) {
      return model === "hybrid_serial" || model === "hybrid_parallel";
    }

    function renderHybridPanel() {
      const model = modelSelect.value;
      const isParallel = model === "hybrid_parallel";
      if (!isHybridModel(model)) {
        hybridPanel.classList.add("hidden");
        return;
      }
      hybridPanel.classList.remove("hidden");
      hybridWeightsEl.classList.toggle("hidden", !isParallel);
      hybridWeightHintEl.classList.toggle("hidden", !isParallel);
      if (!hybridConfig) {
        hybridSettingsEl.textContent = "Loading hybrid settings...";
        return;
      }
      if (model === "hybrid_serial") {
        const s = hybridConfig.serial;
        hybridSettingsEl.innerHTML = `
          Mode: <strong>Serial</strong> — ${escapeHtml(s.description)}<br>
          BM25 candidates: <strong>${s.bm25_candidates}</strong>
        `;
      } else {
        const p = hybridConfig.parallel;
        setParallelWeights(p.bm25_weight, p.dense_weight);
        hybridSettingsEl.innerHTML = `
          Mode: <strong>Parallel</strong> — ${escapeHtml(p.description)}<br>
          BM25 depth: <strong>${p.bm25_depth}</strong> |
          Dense depth: <strong>${p.dense_depth}</strong><br>
          Default fusion: <strong>${escapeHtml(p.fusion_method)}</strong> |
          RRF_K: <strong>${p.rrf_k}</strong>
        `;
      }
    }

    function renderSession(data) {
      const s = data.session || {};
      sessionEl.innerHTML = `
        <strong>Session</strong><br>
        Searches: ${s.search_count ?? 0} |
        History: ${s.history_size ?? 0} |
        Last model: ${s.last_model ?? "-"}<br>
        Last query: ${s.last_query ? `"${escapeHtml(s.last_query)}"` : "-"}
      `;
    }

    function renderSearchSummary(data) {
      const modelLabel = data.model_label || MODEL_LABELS[data.model] || data.model;
      let html = `
        <div class="summary">
          <div><strong>Model:</strong> ${escapeHtml(modelLabel)}</div>
          <div><strong>Query:</strong> ${escapeHtml(data.query)}</div>
          <div><strong>Top K:</strong> ${data.top_k}</div>
          <div><strong>Query refinement:</strong> ${data.use_refinement ? "Yes" : "No"}</div>
          <div><strong>Retrieved:</strong> ${data.result_count}</div>
      `;

      if (data.hybrid_settings) {
        const hs = data.hybrid_settings;
        if (data.model === "hybrid_serial") {
          html += `<div><strong>Hybrid settings:</strong> Serial — BM25 candidates: ${hs.bm25_candidates}</div>`;
        } else {
          html += `<div><strong>Hybrid settings:</strong> Parallel — fusion: ${escapeHtml(hs.fusion_method)}, BM25 weight: ${hs.bm25_weight}, Dense weight: ${hs.dense_weight}, depth: ${hs.bm25_depth}</div>`;
        }
      }

      html += `</div>`;
      searchSummaryEl.innerHTML = html;
    }

    function renderResults(data) {
      if (!data.results.length) {
        resultsEl.innerHTML = "<p>No results.</p>";
        return;
      }

      resultsEl.innerHTML = data.results.map((r) => `
        <div class="result">
          <div class="result-header">Doc ID: ${escapeHtml(r.doc_id)}</div>
          <div class="result-score">Rank: #${r.rank} &nbsp;|&nbsp; Score: ${r.score}</div>
          <div class="full-label">Full Content:</div>
          <div class="full-content">${escapeHtml(r.full_content || r.snippet || "")}</div>
        </div>
      `).join("");
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      return data;
    }

    async function loadHybridConfig() {
      try {
        hybridConfig = await api("/services/hybrid/settings");
        renderHybridPanel();
      } catch (err) {
        hybridSettingsEl.textContent = err.message;
      }
    }

    async function refreshStatus() {
      try {
        const data = await api("/health");
        renderSession(data);
        statusEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      }
    }

    modelSelect.addEventListener("change", renderHybridPanel);
    bm25WeightInput.addEventListener("input", syncBm25Weight);
    denseWeightInput.addEventListener("input", syncDenseWeight);

    document.getElementById("loadBtn").onclick = async () => {
      statusEl.textContent = "Loading index...";
      try {
        await api("/services/index/load", { method: "POST" });
        await refreshStatus();
      } catch (err) {
        statusEl.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      }
    };

    document.getElementById("refineBtn").onclick = async () => {
      const text = document.getElementById("query").value.trim();
      if (!text) return;
      try {
        const data = await api("/services/refine", {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        searchSummaryEl.innerHTML = `<div class="summary"><strong>Query Refinement Preview</strong></div>`;
        resultsEl.innerHTML = `<pre class="meta">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
        await refreshStatus();
      } catch (err) {
        resultsEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    };

    document.getElementById("searchBtn").onclick = async () => {
      const query = document.getElementById("query").value.trim();
      if (!query) return;
      resultsEl.innerHTML = "<p>Searching...</p>";
      searchSummaryEl.innerHTML = "";
      try {
        const payload = {
          query,
          model: modelSelect.value,
          top_k: Number(document.getElementById("topk").value || 10),
          use_refinement: document.getElementById("refine").checked,
        };
        if (modelSelect.value === "hybrid_parallel") {
          payload.bm25_weight = clampWeight(bm25WeightInput.value);
          payload.dense_weight = clampWeight(denseWeightInput.value);
        }
        const data = await api("/services/search", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        await refreshStatus();
        renderSearchSummary(data);
        renderResults(data);
      } catch (err) {
        resultsEl.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    };

    loadHybridConfig();
    refreshStatus();
    renderHybridPanel();
  </script>
</body>
</html>
